[package]
name = "satoimo"
version = "0.1.0"
description = "スポーツ練習動画へ後付け実況を記録するローカルアプリ"
authors = ["satoimo contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "satoimo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"
parking_lot = "0.12"
cpal = "0.16"
hound = "3.5"
crossbeam-channel = "0.5"
thiserror = "2"
dirs = "6"
sysinfo = "0.36"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
