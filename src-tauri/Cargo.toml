[package]
name = "satoimo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "satoimo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
hound = "3.5"
png = "0.18"
